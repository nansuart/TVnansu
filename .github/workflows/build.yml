name: Compilar APK Hispano IPTV

on:
  push:
    branches: [hispano-iptv]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-hispano
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Pruebas (migración y nombres)
        run: gradle :app:testReleaseUnitTest --stacktrace --no-daemon

      - name: Verificar que las pruebas se ejecutaron
        run: |
          f=app/build/test-results/testReleaseUnitTest/TEST-com.hispanoiptv.tv.data.db.MigrationTest.xml
          test -f "$f"
          grep -o '<testsuite[^>]*>' "$f"
          grep -q 'tests="2"' "$f"
          grep -q 'failures="0"' "$f"
          grep -q 'errors="0"' "$f"
          n=app/build/test-results/testReleaseUnitTest/TEST-com.hispanoiptv.tv.data.NamesTest.xml
          test -f "$n"
          grep -o '<testsuite[^>]*>' "$n"
          grep -q 'failures="0"' "$n"

      - name: Compilar
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Preparar APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk HispanoIPTV.apk
          ls -la HispanoIPTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HispanoIPTV-apk
          path: HispanoIPTV.apk

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hispano-v1.0.${{ github.run_number }}
          name: Hispano IPTV 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Hispano IPTV 1.0.${{ github.run_number }}. Instalar en la tele con Downloader usando esta dirección:
            https://github.com/${{ github.repository }}/releases/download/hispano-v1.0.${{ github.run_number }}/HispanoIPTV.apk
          files: HispanoIPTV.apk
          make_latest: false
