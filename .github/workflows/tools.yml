name: Comprobar fuentes

on:
  push:
    branches: [tools]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_sources.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add tools/out/report.json
          git commit -m "Resultado de la comprobación de fuentes" || true
          git push
